[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-traffic-capture"
description = "Capture requests/httpx/aiohttp traffic during tests as HAR 1.2 and cURL commands"
version = "0.1.0"
readme = "README.rst"
requires-python = ">=3.8"
authors = [
    { name = "pytest-traffic-capture contributors" },
]
maintainers = [
    { name = "pytest-traffic-capture contributors" },
]
license = {file = "LICENSE"}
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytest>=8",
]

[project.optional-dependencies]
test = [
    "requests",
    "httpx",
    "aiohttp",
]

[project.entry-points.pytest11]
pytest_traffic_capture = "pytest_traffic_capture.plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytest_traffic_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
