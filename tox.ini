[tox]
envlist = py39,py310,py311,py312,py313,pypy3,aiohttp39,pytest-latest,flake8

[testenv]
deps =
    # pytest 9.2 在 Python 3.10.0 上收集时会失败（上游 NodeId bug）。
    pytest>=8,<9.2
    requests
    httpx
    aiohttp
commands = pytest {posargs:tests}

[testenv:aiohttp39]
basepython = python3.10
deps =
    pytest>=8,<9.2
    requests
    httpx
    aiohttp>=3.9,<3.10
commands = pytest {posargs:tests}

[testenv:pytest-latest]
basepython = python3.12
deps =
    pytest
    requests
    httpx
    aiohttp
commands = pytest {posargs:tests}

[testenv:flake8]
skip_install = true
deps = flake8
commands = flake8 src tests

[flake8]
max-line-length = 100
